name: restaurant_app
description: Restaurant App with Dicoding API
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  http: ^1.1.0
  flutter_dotenv: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  google_fonts: ^6.1.0
  sqflite: ^2.4.2
  shared_preferences: ^2.5.4
  flutter_local_notifications: ^19.5.0
  workmanager: ^0.9.0+3
  sqflite_common_ffi: ^2.4.0+1
  mockito: ^5.6.1
  path: ^1.9.1
  mocktail: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  http_mock_adapter: ^0.6.1
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app.png"
  remove_alpha_ios: true